<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jupiter Supply — Master Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0f1f3d;--gold:#D4A017;--bg:#f4f6fb;--card:#fff;--txt:#1c2b4a;--mut:#6b7a99;--line:#e3e8f2}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top .logo{font-weight:800;font-size:18px}.top .logo span{color:var(--gold)}
.top .badge{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;letter-spacing:.5px}
.top .sp{flex:1}.top a{color:#9db2d8;font-size:13px;text-decoration:none;margin-left:14px}
.layout{display:flex;min-height:calc(100vh - 52px)}
.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:14px 8px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:12px 12px 4px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--txt);cursor:pointer}
.side button:hover{background:#eef2fa}
.side button.on{background:var(--navy);color:#fff;font-weight:600}
.main{flex:1;padding:22px;max-width:1180px}
.hd{display:flex;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.hd h2{font-size:22px}.hd .sp{flex:1}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:#fff;border:1px solid #f0b0b0;color:#c0392b}
.btn.sm{padding:5px 10px;font-size:12px;margin:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .n{font-size:22px;font-weight:800}.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f9fd;text-align:left;padding:10px 12px;color:var(--mut);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcff}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;background:#eef2fa;color:var(--navy)}
.tag.green{background:#e6f7ea;color:#1e7e34}.tag.gold{background:#fdf3d8;color:#8a6d00}.tag.red{background:#fdecea;color:#c0392b}
.empty{padding:36px;text-align:center;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(15,31,61,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.open{display:flex}
.form{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:560px}
.form h3{margin-bottom:14px;font-size:18px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.fld textarea{resize:vertical;min-height:64px}
.frow{display:flex;gap:10px}.frow .fld{flex:1}
.fact{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;display:none;z-index:99;max-width:90vw}
.items{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
.irow{display:flex;gap:8px;margin-bottom:8px}.irow input{padding:7px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.irow .d{flex:2}.irow .q,.irow .p{flex:1;min-width:0}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;max-width:680px}
.rep h3{margin-bottom:10px}.rep table td:last-child,.rep table th:last-child{text-align:right}
.rep .tot td{font-weight:800;border-top:2px solid var(--txt)}
.note{color:var(--mut);font-size:13px;margin-top:8px}
@media(max-width:760px){.side{width:60px}.side button{font-size:0}.side button::first-letter{font-size:14px}.side .grp{display:none}.main{padding:14px}}
</style></head><body>
<div class="top"><div class="logo">🪐 JUPITER <span>SUPPLY</span></div><div class="badge">MASTER DASHBOARD</div><div class="sp"></div><span id="userbox" style="font-size:13px;color:#9db2d8"></span><a href="/crm">CRM</a><a href="/">Search</a><a href="/docs">API</a></div>
<div class="layout">
<div class="side" id="nav"></div>
<div class="main" id="main"><div class="empty">Loading…</div></div>
</div>
<div class="modal" id="modal"><div class="form" id="formbox"></div></div>
<div class="modal open" id="loginModal" style="background:var(--navy)"><div class="form" style="max-width:380px;text-align:center">
<div style="font-size:40px;margin-bottom:8px">🪐</div><h3>Jupiter Supply</h3>
<p class="note" style="margin-bottom:16px">Master Dashboard — sign in</p>
<div class="fld" style="text-align:left"><label>Email</label><input id="li_email" type="email" placeholder="you@company.com"></div>
<div class="fld" style="text-align:left"><label>Password</label><input id="li_pass" type="password" placeholder="••••••••"></div>
<div id="li_err" style="color:#c0392b;font-size:13px;min-height:20px;margin-bottom:8px"></div>
<button class="btn" style="width:100%" onclick="doLogin()">Sign in</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
// ---- auth ----
const TOKEN_KEY='jup_admin_token';
function token(){return sessionStorage.getItem(TOKEN_KEY);}
function setToken(t){if(t)sessionStorage.setItem(TOKEN_KEY,t);else sessionStorage.removeItem(TOKEN_KEY);}
async function doLogin(){
  const e=$('li_email').value.trim(),p=$('li_pass').value;
  $('li_err').textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'Login failed');
    setToken(j.access_token);
    $('loginModal').classList.remove('open');
    setUser(j.user);renderNav();SECTIONS.dash();
  }catch(err){$('li_err').textContent='⚠️ '+err.message;}
}
  }catch(err){$('li_err').textContent='⚠️ '+err.message;}
}
function doLogout(){setToken(null);location.reload();}
function setUser(u){const el=$('userbox');if(el)el.innerHTML=esc(u.full_name||u.email)+' <a href="#" onclick="changePw();return false" style="color:#9db2d8">password</a> · <a href="#" onclick="doLogout();return false" style="color:#9db2d8">logout</a>';}
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+(token()||'')},body:body?JSON.stringify(body):undefined});
  if(r.status===401){setToken(null);$('loginModal').classList.add('open');throw new Error('Session expired — please sign in');}
  if(!r.ok){let d='';try{d=(await r.json()).detail||'';}catch(_){}throw new Error('Failed ('+r.status+') '+d);}
  return r.status===204?null:r.json();
}
const money=n=>'$'+Number(n||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
function stTag(s){const c={new:'gold',contacted:'',qualified:'green',converted:'green',lost:'red',draft:'',sent:'',approved:'green',unpaid:'gold',paid:'green',overdue:'red',void:'red'};return '<span class="tag '+(c[s]||'')+'">'+esc(s)+'</span>';}

/* ---------------- navigation ---------------- */
const NAV=[
 {g:'Overview'},{id:'dash',t:'📊 Dashboard'},
 {g:'Catalog'},{id:'products',t:'📦 Products'},{id:'categories',t:'🗂 Categories'},{id:'suppliers',t:'🏭 Suppliers'},
 {g:'Sales'},{id:'leads',t:'🧲 Leads'},{id:'customers',t:'🏨 Customers'},{id:'contacts',t:'👤 Contacts'},{id:'quotes',t:'📝 Quotes'},{id:'invoices',t:'🧾 Invoices'},
 {g:'Accounting'},{id:'bills',t:'💸 Bills'},{id:'chart',t:'📚 Chart of Accounts'},{id:'tax',t:'🏛 Tax Center (GST)'},{id:'ar',t:'⏳ Aged Receivables'},{id:'ap',t:'⏳ Aged Payables'},{id:'sales',t:'💹 Sales Reports'},{id:'pl',t:'📈 Profit & Loss'},{id:'bs',t:'⚖️ Balance Sheet'},
 {g:'Compliance'},{id:'compliance',t:'🏛 Compliance Desk'},
 {g:'Point of Sale'},{id:'pos',t:'🧾 POS Sale'},
 {g:'Intake'},{id:'intake',t:'📥 Email Intake'},
 {g:'Voice'},{id:'voice',t:'📞 Call Log'},
];
let cur='dash';
function renderNav(){$('nav').innerHTML=NAV.map(n=>n.g?'<div class="grp">'+n.g+'</div>':'<button data-id="'+n.id+'" class="'+(cur===n.id?'on':'')+'" onclick="go(\''+n.id+'\')">'+n.t+'</button>').join('');}
function go(id){cur=id;renderNav();SECTIONS[id]();window.scrollTo(0,0);}

/* ---------------- modal form ---------------- */
function fldHTML(f,initial){
  const v=initial[f.k]!=null?initial[f.k]:(f.def||'');
  let inner='';
  if(f.t==='select'){inner='<select id="f_'+f.k+'">'+f.opts.map(o=>'<option value="'+esc(o.v)+'"'+(String(v)===String(o.v)?' selected':'')+'>'+esc(o.l)+'</option>').join('')+'</select>';}
  else if(f.t==='textarea'){inner='<textarea id="f_'+f.k+'">'+esc(v)+'</textarea>';}
  else if(f.t==='check'){return '<div class="fld"><label class="chk"><input type="checkbox" id="f_'+f.k+'"'+(v?' checked':'')+'> '+esc(f.label)+'</label></div>';}
  else{inner='<input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';}
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+inner+'</div>';
}
function openForm(title,fields,onSave,initial){
  initial=initial||{};
  let h='<h3>'+esc(title)+'</h3>';
  fields.forEach(f=>{
    if(f.t==='row'){h+='<div class="frow">';f.items.forEach(sf=>{h+=fldHTML(sf,initial);});h+='</div>';return;}
    h+=fldHTML(f,initial);
  });
  h+='<div class="fact"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="savebtn">Save</button></div>';
  $('formbox').innerHTML=h;$('modal').classList.add('open');
  $('savebtn').onclick=async()=>{
    const data={};
    fields.forEach(f=>{(f.t==='row'?f.items:[f]).forEach(sf=>{
      const el=$('f_'+sf.k);if(!el)return;
      if(sf.t==='check')data[sf.k]=el.checked;
      else if(el.value==='')data[sf.k]=null;
      else data[sf.k]=sf.num?Number(el.value):el.value;
    });});
    try{await onSave(data);closeModal();toast('Saved ✅');SECTIONS[cur]();}
    catch(e){toast('⚠️ '+e.message);}
  };
}
function closeModal(){$('modal').classList.remove('open');}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

/* ---------------- table ---------------- */
function table(cols,rows,actions){
  if(!rows.length)return '<div class="empty">Nothing here yet — click <b>+ Add</b> to create the first one.</div>';
  let h='<div class="tblwrap"><table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+(actions?'<th></th>':'')+'</tr>';
  rows.forEach(r=>{h+='<tr>'+r.cells.map(c=>'<td>'+c+'</td>').join('')+(actions?'<td style="white-space:nowrap">'+actions(r)+'</td>':'')+'</tr>';});
  return h+'</table></div>';
}
const eb=id=>'<button class="btn ghost sm" onclick="openEdit(\''+id+'\')">Edit</button>';
const db=id=>'<button class="btn danger sm" onclick="delRow(\''+id+'\')">Delete</button>';
const DEL_PATH={products:'/api/products/',categories:'/api/categories/',suppliers:'/api/suppliers/',customers:'/api/customers/',leads:'/api/leads/',contacts:'/api/contacts/',bills:'/api/accounting/bills/'};
let ROWS={};
async function delRow(id){
  if(!confirm('Delete this record?'))return;
  try{await api('DELETE',DEL_PATH[cur]+id);toast('Deleted');SECTIONS[cur]();}
  catch(e){toast('⚠️ '+e.message);}
}

/* ---------------- SECTIONS ---------------- */
const SECTIONS={};

SECTIONS.dash=async()=>{
  const s=await api('GET','/api/dashboard/stats');
  const cards=[['🧲 New leads',s.leads_new],['🏨 Customers',s.customers],['🏭 Suppliers',s.suppliers],['📦 Products',s.products],['📝 Draft quotes',s.quotes_draft],['🧾 Unpaid invoices',s.invoices_unpaid],['💰 Receivable',money(s.receivable)],['✅ Revenue (paid)',money(s.revenue_paid)]];
  $('main').innerHTML='<div class="hd"><h2>📊 Dashboard</h2></div><div class="cards">'
    +cards.map(x=>'<div class="stat"><div class="n">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>').join('')+'</div>'
    +'<p class="note">Live from your database — updates every time you open this page.</p>';
};

async function crudSection(title,path,cols,rowFn,fields,editFields){
  const rows=await api('GET',path);
  ROWS={};rows.forEach(r=>ROWS[r.id]=r);
  $('main').innerHTML='<div class="hd"><h2>'+title+'</h2><div class="sp"></div><button class="btn" onclick="openAdd()">+ Add</button></div>'
    +table(cols,rows.map(r=>({id:r.id,cells:rowFn(r)})),r=>eb(r.id)+' '+db(r.id));
  window.openAdd=()=>openForm('Add '+title.split(' ').slice(1).join(' '),fields,async d=>{await api('POST',path,d);});
  window.openEdit=id=>openForm('Edit',editFields||fields,async d=>{await api('PUT',path+'/'+id,d);},ROWS[id]);
}

let CATS=[],SUPS=[],CUSTS=[];
async function refs(){[CATS,SUPS]=await Promise.all([api('GET','/api/categories'),api('GET','/api/suppliers')]);}

const PROD_F=()=>[
  {k:'sku',label:'SKU *',ph:'JS-65-001'},
  {k:'name',label:'Product name *'},
  {k:'description',label:'Description',t:'textarea'},
  {k:'category_id',label:'Category',t:'select',opts:[{v:'',l:'— none —'}].concat(CATS.map(c=>({v:c.id,l:c.name})))},
  {k:'supplier_id',label:'Supplier (internal)',t:'select',opts:[{v:'',l:'— none —'}].concat(SUPS.map(s=>({v:s.id,l:s.name})))},
  {k:'unit',label:'Unit',t:'select',opts:['each','dozen','case','pack','box'].map(u=>({v:u,l:u}))},
  {t:'row',items:[{k:'cost_price',label:'Cost (internal)',t:'number',num:1},{k:'sell_price',label:'Sell price',t:'number',num:1}]},
  {k:'show_price',label:'Show price to customers',t:'check'},
];
SECTIONS.products=async()=>{
  await refs();
  await crudSection('📦 Products','/api/products',['SKU','Name','Category','Sell'],
    r=>['<b>'+esc(r.sku)+'</b>',esc(r.name),esc((r.categories||{}).name||'—'),r.sell_price?money(r.sell_price):'<span class="tag">on quote</span>'],
    PROD_F(),PROD_F());
};

SECTIONS.categories=async()=>{
  const F=[{k:'name',label:'Name *'},{k:'slug',label:'Slug (auto if blank)',ph:'hotel-towels'},{k:'sort_order',label:'Sort order',t:'number',num:1,def:0}];
  await crudSection('🗂 Categories','/api/categories',['Name','Slug'],
    r=>['<b>'+esc(r.name)+'</b>','<span class="tag">'+esc(r.slug)+'</span>'],F);
};

SECTIONS.suppliers=async()=>{
  const F=[{k:'name',label:'Supplier name *'},{k:'contact_name',label:'Contact person'},
    {t:'row',items:[{k:'email',label:'Email'},{k:'phone',label:'Phone'}]},
    {k:'country',label:'Country',def:'China'},{k:'notes',label:'Internal notes',t:'textarea'}];
  await crudSection('🏭 Suppliers','/api/suppliers',['Name','Contact','Email','Phone'],
    r=>['<b>'+esc(r.name)+'</b>',esc(r.contact_name||'—'),esc(r.email||'—'),esc(r.phone||'—')],F);
};

SECTIONS.customers=async()=>{
  const F=[{k:'company_name',label:'Company / hotel name *'},{k:'contact_name',label:'Contact person'},
    {t:'row',items:[{k:'email',label:'Email'},{k:'phone',label:'Phone'}]},
    {k:'address',label:'Address',t:'textarea'},
    {k:'customer_type',label:'Type',t:'select',opts:['hotel','restaurant','medical','other'].map(t=>({v:t,l:t}))},
    {k:'notes',label:'Notes',t:'textarea'}];
  await crudSection('🏨 Customers','/api/customers',['Company','Contact','Phone','Type'],
    r=>['<b>'+esc(r.company_name)+'</b>',esc(r.contact_name||'—'),esc(r.phone||'—'),'<span class="tag">'+esc(r.customer_type)+'</span>'],F);
};

SECTIONS.leads=async()=>{
  const rows=await api('GET','/api/leads');ROWS={};rows.forEach(r=>ROWS[r.id]=r);
  const F=[{k:'company_name',label:'Company *'},{k:'contact_name',label:'Contact'},
    {t:'row',items:[{k:'phone',label:'Phone'},{k:'email',label:'Email'}]},
    {t:'row',items:[{k:'source',label:'Source',ph:'website / referral'},{k:'status',label:'Status',t:'select',opts:['new','contacted','qualified','converted','lost'].map(s=>({v:s,l:s}))}]},
    {k:'notes',label:'Notes',t:'textarea'}];
  $('main').innerHTML='<div class="hd"><h2>🧲 Leads</h2><div class="sp"></div><button class="btn" onclick="openAdd()">+ Add</button></div>'
    +table(['Company','Contact','Status','Source'],rows.map(r=>({id:r.id,cells:['<b>'+esc(r.company_name)+'</b>',esc(r.contact_name||'—'),stTag(r.status),esc(r.source||'—')]})),r=>eb(r.id)+' '+db(r.id)+(ROWS[r.id].status!=='converted'?' <button class="btn sm" onclick="convertLead(\''+r.id+'\')">→ Customer</button>':''));
  window.openAdd=()=>openForm('Add lead',F,async d=>{await api('POST','/api/leads',d);});
  window.openEdit=id=>openForm('Edit lead',F,async d=>{await api('PUT','/api/leads/'+id,d);},ROWS[id]);
};
async function convertLead(id){if(!confirm('Convert this lead to a customer?'))return;try{await api('POST','/api/leads/'+id+'/convert');toast('Converted to customer ✅');SECTIONS.leads();}catch(e){toast('⚠️ '+e.message);}}

SECTIONS.contacts=async()=>{
  const rows=await api('GET','/api/contacts');ROWS={};rows.forEach(r=>ROWS[r.id]=r);
  const F=[{k:'full_name',label:'Full name *'},{k:'role',label:'Role / title'},
    {t:'row',items:[{k:'phone',label:'Phone'},{k:'email',label:'Email'}]},{k:'notes',label:'Notes',t:'textarea'}];
  $('main').innerHTML='<div class="hd"><h2>👤 Contacts</h2><div class="sp"></div><button class="btn" onclick="openAdd()">+ Add</button></div>'
    +table(['Name','Role','Phone','Email'],rows.map(r=>({id:r.id,cells:['<b>'+esc(r.full_name)+'</b>',esc(r.role||'—'),esc(r.phone||'—'),esc(r.email||'—')]})),r=>eb(r.id)+' '+db(r.id));
  window.openAdd=()=>openForm('Add contact',F,async d=>{if(!d.customer_id&&!d.lead_id)throw new Error('Attach to a customer or lead first (coming soon)');await api('POST','/api/contacts',d);});
  window.openEdit=id=>openForm('Edit contact',F,async d=>{await api('PUT','/api/contacts/'+id,d);},ROWS[id]);
};

SECTIONS.quotes=async()=>{
  const rows=await api('GET','/api/quotes');ROWS={};rows.forEach(r=>ROWS[r.id]=r);
  $('main').innerHTML='<div class="hd"><h2>📝 Quotes</h2><div class="sp"></div><button class="btn" onclick="newQuote()">+ New Quote</button></div>'
    +table(['Number','Customer','Total','Status'],rows.map(r=>({id:r.id,cells:['<b>'+esc(r.quote_number)+'</b>',esc((r.customers||{}).company_name||'—'),money(r.total),stTag(r.status)]})),r=>'<button class="btn ghost sm" onclick="viewQuote(\''+r.id+'\')">View</button>');
};
async function newQuote(){
  CUSTS=await api('GET','/api/customers');
  if(!CUSTS.length){toast('Add a customer first');return;}
  docForm('New quote','/api/quotes','quote');
}
function docForm(title,path,kind){
  let h='<h3>'+title+'</h3><div class="fld"><label>Customer *</label><select id="q_cust">'+CUSTS.map(c=>'<option value="'+c.id+'">'+esc(c.company_name)+'</option>').join('')+'</select></div>';
  h+='<div class="fld"><label>Line items</label><div class="items" id="q_items"></div><button class="btn ghost sm" type="button" onclick="addQRow()">+ Add line</button></div>';
  h+='<div class="fld"><label>Note for customer</label><textarea id="q_note"></textarea></div>';
  h+='<div class="fact"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="savebtn">Create</button></div>';
  $('formbox').innerHTML=h;$('modal').classList.add('open');addQRow();
  $('savebtn').onclick=async()=>{
    const items=[...document.querySelectorAll('#q_items .irow')].map(r=>({description:r.querySelector('.d').value,quantity:Number(r.querySelector('.q').value)||1,unit_price:Number(r.querySelector('.p').value)||0})).filter(i=>i.description);
    if(!items.length){toast('Add at least one line item');return;}

/* ---- POS ---- */
let POS_CART=[];
SECTIONS.pos=async()=>{
  const t=await api('GET','/api/pos/today');
  POS_CART=[];
  $('main').innerHTML='<div class="hd"><h2>🧾 POS — New Sale</h2><div class="sp"></div><div class="stat" style="min-width:170px"><div class="n">'+money(t.total)+'</div><div class="l">Today · '+t.sales+' sales</div></div></div>'
  +'<div class="rep"><h3>1. Find product</h3><div class="frow"><div class="fld" style="flex:2"><input id="pos_q" placeholder="Type name or SKU…" oninput="posSearch()"></div></div><div id="pos_results"></div></div>'
  +'<div class="rep"><h3>2. Cart</h3><div id="pos_cart"><p class="note">Cart is empty.</p></div></div>'
  +'<div class="rep"><h3>3. Payment</h3><div class="frow"><div class="fld"><label>Method</label><select id="pos_pay"><option value="cash">Cash</option><option value="card">Card</option><option value="e_transfer">E-transfer</option><option value="cheque">Cheque</option></select></div><div class="fld"><label>Reference (optional)</label><input id="pos_ref"></div></div>'
  +'<button class="btn" onclick="posCheckout()" style="width:100%;padding:14px;font-size:16px;margin-top:8px">Complete Sale</button></div>'
  +'<div id="pos_receipt"></div>';
  window.posSearch=async()=>{
    const q=$('pos_q').value.trim();if(q.length<2){$('pos_results').innerHTML='';return;}
    const r=await api('GET','/api/products?q='+encodeURIComponent(q));
    $('pos_results').innerHTML=r.slice(0,8).map(p=>'<div class="irow" style="align-items:center"><div class="d"><b>'+esc(p.name)+'</b><br><span class="note">'+esc(p.sku)+(p.sell_price?' · '+money(p.sell_price):'')+'</span></div><button class="btn sm" onclick=\'posAdd("'+p.id+'")\'>Add</button></div>').join('')||'<p class="note">No match.</p>';
    window._posCache={};r.forEach(p=>window._posCache[p.id]=p);
  };
  window.posAdd=id=>{
    const p=window._posCache[id];const ex=POS_CART.find(i=>i.product_id===id);
    if(ex)ex.quantity++;else POS_CART.push({product_id:id,description:p.name,quantity:1,unit_price:Number(p.sell_price)||0});
    posCartDraw();
  };
  window.posCartDraw=()=>{
    if(!POS_CART.length){$('pos_cart').innerHTML='<p class="note">Cart is empty.</p>';return;}
    const st=POS_CART.reduce((a,i)=>a+i.quantity*i.unit_price,0);
    $('pos_cart').innerHTML=table(['Item','Qty','Price','Total'],POS_CART.map((i,x)=>({cells:[esc(i.description),'<input type="number" value="'+i.quantity+'" min="1" style="width:60px;padding:4px" onchange="POS_CART['+x+'].quantity=Number(this.value);posCartDraw()">',money(i.unit_price),money(i.quantity*i.unit_price)]})))
    +'<table><tr><td>Subtotal</td><td style="text-align:right">'+money(st)+'</td></tr><tr><td>GST (5%)</td><td style="text-align:right">'+money(st*0.05)+'</td></tr><tr class="tot"><td><b>Total</b></td><td style="text-align:right"><b>'+money(st*1.05)+'</b></td></tr></table>';
  };
  window.posCheckout=async()=>{
    if(!POS_CART.length){toast('Cart is empty');return;}
    try{
      const r=await api('POST','/api/pos/sale',{items:POS_CART,payment_method:$('pos_pay').value,reference:$('pos_ref').value||null});
      $('pos_receipt').innerHTML='<div class="rep" style="border:2px solid var(--gold)"><h3>✅ Sale complete</h3><p>Order <b>'+r.order_number+'</b> · Invoice <b>'+r.invoice_number+'</b></p><p style="font-size:20px;margin:8px 0"><b>'+money(r.total)+'</b> via '+esc(r.payment_method)+'</p><button class="btn ghost" onclick="SECTIONS.pos()">New sale</button></div>';
      POS_CART=[];$('pos_cart').innerHTML='<p class="note">Cart is empty.</p>';window.scrollTo(0,document.body.scrollHeight);
    }catch(e){toast('⚠️ '+e.message);}
  };
};
